name: Compilar e publicar BIPADO DE ROTA
on:
  push:
    branches: [main]
    paths: ['projeto.zip', '.github/workflows/compilar.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-bipado
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
      - name: Preparar SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Validar recebimento do ZIP
        run: python3 -m unittest discover -s . -v
      - name: Testar, assinar e publicar
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_REPOSITORY: ${{ github.repository }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
          BIPADO_SIGNING_KEY_B64: ${{ secrets.BIPADO_SIGNING_KEY_B64 }}
        run: python3 publicar.py
